<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <!-- Character encoding -->
  <meta charset="UTF-8">

  <!-- Favicon and device-specific icons -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Viewport settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- Primary Meta Tags -->
  <title>
    <%= title %> | BQPCA System
  </title>
  <meta name="title" content="BQPCA System">
  <meta name="description" content="Bhutan Qualification & Certification Portal">
  <meta property="og:url" content="https://bqpca.gov.bt">
  <meta property="og:title" content="BQPCA System | Bhutan Qualification & Certification">
  <meta property="og:description" content="This is Bhutan’s certification portal">


  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- SEO -->
  <meta name="robots" content="index, follow">
  <meta name="author" content="Bhutan Qualification & Professional Certification Authority">
  <meta name="keywords" content="BQPCA, Bhutan Qualification, Professional Certification, <%= keywords %>">

  <!-- Theme -->
  <meta name="theme-color" content="#1e40af">
  <meta name="color-scheme" content="light">

  <!-- Critical CSS -->
  <style>
    body {
      margin: 0;
    }

    #app-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f8fafc;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="app-loading">
      <img src="/icons/icon-96x96.png" alt="BQPCA System" width="96" height="96">
    </div>
  </div>

  <noscript>
    <strong>We're sorry but the BQPCA System doesn't work properly without JavaScript enabled. Please enable it to
      continue.</strong>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>

</html>

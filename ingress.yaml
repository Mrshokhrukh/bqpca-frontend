# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bqpca-ingress
  annotations:
    # This annotation is still needed for the redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  # This is the modern way to specify the Ingress Controller
  ingressClassName: nginx
  tls:
  - hosts:
    - bqpca.systems.gov.bt
    secretName: bqpca-tls-secret
  rules:
  - host: bqpca.systems.gov.bt
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bqpca-frontend-service
            port:
              number: 80
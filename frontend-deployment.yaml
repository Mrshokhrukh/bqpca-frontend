apiVersion: apps/v1
kind: Deployment
metadata:
  name: bqpca-frontend-deployment
  labels:
    app: bqpca-frontend
spec:
  replicas: 6
  selector:
    matchLabels:
      app: bqpca-frontend
  template:
    metadata:
      labels:
        app: bqpca-frontend
    spec:
      containers:
      - name: bqpca-frontend
        image: druksmartdeveloper2024/bqpca-frontend:v1.0.0
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: regcred 
---
apiVersion: v1
kind: Service
metadata:
  name: bqpca-frontend-service
spec:
  type: NodePort
  selector:
    app: bqpca-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

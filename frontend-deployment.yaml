# frontend-deployment.yaml

# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bqpca-frontend-deployment
  labels:
    app: bqpca-frontend
spec:
  replicas: 6
  selector:
    matchLabels:
      app: bqpca-frontend
  template:
    metadata:
      labels:
        app: bqpca-frontend
    spec:
      containers:
      - name: bqpca-frontend
        # IMPORTANT: Updated to use the v1.0.0 tag
        image: your-docker-registry/bqpca-frontend:v1.0.0
        ports:
        - containerPort: 80

---

# --- Service ---
# This part does not need to be changed.
apiVersion: v1
kind: Service
metadata:
  name: bqpca-frontend-service
spec:
  type: NodePort
  selector:
    app: bqpca-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80